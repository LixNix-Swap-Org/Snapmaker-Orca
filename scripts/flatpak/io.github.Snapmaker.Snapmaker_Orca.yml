  - name: Snapmaker_Orca
    buildsystem: simple
    build-commands:
      - |
        set -euo pipefail
        export CMAKE_POLICY_VERSION_MINIMUM=3.5
        export FLATPAK_BUILDER_N_JOBS="${FLATPAK_BUILDER_N_JOBS:-4}"
        test -f /app/include/openvdb/version.h
        test -f /app/lib/libopenvdb.a -o -f /app/lib64/libopenvdb.a
        mkdir -p build_flatpak
        CXXFLAGS=-std=gnu++20 cmake . -B build_flatpak \
          -DSLIC3R_PCH=OFF \
          -DSLIC3R_FHS=ON \
          -DSLIC3R_GTK=3 \
          -DSLIC3R_STATIC=ON \
          -DBUILD_TESTS=OFF \
          -DSLIC3R_DESKTOP_INTEGRATION=OFF \
          -DCMAKE_BUILD_TYPE=Release \
          -DFLATPAK=ON \
          -DBBL_RELEASE_TO_PUBLIC=1 \
          -DCMAKE_PREFIX_PATH=/app \
          -DCMAKE_INSTALL_PREFIX=/app \
          -DOPENVDB_ROOT=/app \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        CXXFLAGS=-std=gnu++20 cmake --build build_flatpak --target Snapmaker_Orca -j"${FLATPAK_BUILDER_N_JOBS:-4}"
        ./scripts/run_gettext.sh
        CXXFLAGS=-std=gnu++20 cmake --build build_flatpak --target install -j"${FLATPAK_BUILDER_N_JOBS:-4}"

    # Built (not run) here when CI injects run-tests, then shipped to a separate
    # test job. Only the test sources compile; nothing installs to /app.
    test-commands:
      # CXXFLAGS and CMAKE_POLICY_VERSION_MINIMUM match the build block above;
      # this reconfigures the same build tree and must not contradict it.
      - CXXFLAGS=-std=gnu++20 cmake . -B build_flatpak -DBUILD_TESTS=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      # A suite missing from this list fails the leg loudly, since ctest registers a
      # <target>_NOT_BUILT test for it. (tests/all is a Ninja subdirectory target and
      # this build uses the default Makefile generator, so it is not available here.)
      - CXXFLAGS=-std=gnu++20 cmake --build build_flatpak -j"${FLATPAK_BUILDER_N_JOBS:-$(nproc)}" --target
          libslic3r_tests fff_print_tests sla_print_tests libnest2d_tests slic3rutils_tests
          gateway_tests filament_group_tests

    cleanup:
      - /include

    post-install:
      # Dependency debug info only: flatpak-builder splits this module's own out
      # after post-install, so --with-debuginfo still ships the app's symbols.
      - |
        set -euo pipefail
        rm -rf /app/lib/debug

      - | # Keep the AppStream <release> entry in sync with version.inc (it went stale at 2.3.6 otherwise)
        set -euo pipefail
        _ver=$(sed -n 's/^set(Snapmaker_VERSION "\([^"]*\)").*/\1/p' version.inc)
        test -n "${_ver}"
        sed -e "s|<release version=\"[^\"]*\" date=\"[^\"]*\">|<release version=\"${_ver}\" date=\"$(date -u +%Y-%m-%d)\">|" \
            -e "s|<p>Version [^ ]* release|<p>Version ${_ver} release|" ${FLATPAK_ID}.metainfo.xml > ${FLATPAK_ID}.metainfo.xml.tmp
        mv ${FLATPAK_ID}.metainfo.xml.tmp ${FLATPAK_ID}.metainfo.xml
        grep -q "<release version=\"${_ver}\" date=" ${FLATPAK_ID}.metainfo.xml

      - | # Desktop Integration files
        install -Dm644 -t /app/share/icons/hicolor/scalable/apps/ resources/images/Snapmaker_Orca.svg
        install -Dm644 ${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
        mv /app/share/applications/Snapmaker_Orca.desktop /app/share/applications/${FLATPAK_ID}.desktop
        desktop-file-edit --set-key=Exec --set-value="entrypoint %U" /app/share/applications/${FLATPAK_ID}.desktop
        install -Dm755 entrypoint /app/bin
        install -Dm755 umount /app/bin

    sources:
      # -
      # Section bellow fetches all Snapmaker_Orca dependencies before the build process and stores them in external-packages/*/* .
      # -DDEP_DOWNLOAD_DIR is set in the build process which has to match with dest.
      #
      # NOTE: The url, dest folder name and sha256 must match from Snapmaker_Orca's cmake scripts and folder names in Snapmaker_Orca/deps/
      # -

      # Snapmaker_Orca Source Archive
      - type: dir 
        path: ../../

      # AppData metainfo for Gnome Software & Co.
      - type: file
        path: io.github.Snapmaker.Snapmaker_Orca.metainfo.xml

      # start-up script
      - type: file
        path: entrypoint

      # umount wrapper used to redirect umount calls to udisk2
      - type: file
        path: umount
