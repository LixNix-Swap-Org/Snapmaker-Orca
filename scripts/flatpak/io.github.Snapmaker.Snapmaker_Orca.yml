app-id: io.github.Snapmaker.Snapmaker_Orca
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm21
command: entrypoint
separate-locales: true
rename-icon: Snapmaker_Orca 
finish-args:
  - --share=ipc
  - --socket=x11
  - --share=network
  - --device=all
  - --filesystem=home
  - --filesystem=xdg-run/gvfs
  - --filesystem=/run/media
  - --filesystem=/media
  - --filesystem=/run/spnav.sock:ro
  # Allow Snapmaker_Orca to talk to other instances
  - --talk-name=io.github.Snapmaker.Snapmaker_Orca.InstanceCheck.*
  - --system-talk-name=org.freedesktop.UDisks2
  - --env=SPNAV_SOCKET=/run/spnav.sock

build-options:
  append-path: /usr/lib/sdk/llvm21/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm21/lib
  env:
    CC: clang
    CXX: clang++
    LDFLAGS: "-fuse-ld=lld"
    CMAKE_POLICY_VERSION_MINIMUM: "3.5"

# orca_deps installs static libs and headers into /app for SLIC3R_STATIC linking, and
# module "cleanup:" only removes files that module installed, so the build-only
# artifacts go here (~140MB bundles vs ~600MB). The cleanup phase runs after every
# module, including this manifest's test-commands, which reconfigure with
# -DBUILD_TESTS=ON and still need the headers, static libs and wx-config.
cleanup-commands:
  - |
    set -euo pipefail
    rm -rf /app/include
    find /app/lib /app/lib64 -name '*.a' -delete
    find /app/lib /app/lib64 -name '*.la' -delete
    rm -rf /app/lib/cmake /app/lib/pkgconfig
    rm -rf /app/lib64/cmake /app/lib64/pkgconfig
    rm -rf /app/share/doc /app/share/ECM /app/share/cmake /app/share/man /app/share/info
    for _tool in vdb_print qconvex qdelaunay qhalf qhull qvoronoi rbox openssl c_rehash curl-config env.sh wx-config wxrc wxrc-3.1; do
      rm -f "/app/bin/${_tool}"
    done

modules:

  # JPEG codec for the liveview
  - name: gst-plugins-good
    buildsystem: meson
    config-opts:
      - -Dauto_features=disabled
      - -Djpeg=enabled
      - -Ddoc=disabled
      - -Dexamples=disabled
      - -Dtests=disabled
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-plugins-good/gst-plugins-good-1.22.8.tar.xz
        sha256: e305b9f07f52743ca481da0a4e0c76c35efd60adaf1b0694eb3bb021e2137e39

  - name: kde-extra-cmake-modules
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://github.com/KDE/extra-cmake-modules
        tag: v5.249.0
    cleanup:
      - / 

  - name: libspnav
    sources:
      - type: archive
        url: https://github.com/FreeSpacenav/libspnav/releases/download/v1.2/libspnav-1.2.tar.gz
        sha256: 093747e7e03b232e08ff77f1ad7f48552c06ac5236316a5012db4269951c39db

  # wxWidgets built as a separate module (no network at build time).
  # Config-opts mirror deps/wxWidgets/wxWidgets.cmake with FLATPAK=ON, DEP_WX_GTK3=ON
  - name: orca_wxwidgets
    buildsystem: cmake-ninja
    build-options:
      env:
        CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DwxBUILD_PRECOMP=ON
      - -DwxBUILD_TOOLKIT=gtk3
      - -DCMAKE_DEBUG_POSTFIX:STRING=d
      - -DwxBUILD_DEBUG_LEVEL=0
      - -DwxBUILD_SAMPLES=OFF
      - -DwxBUILD_SHARED=ON
      - -DBUILD_SHARED_LIBS=ON
      - -DwxUSE_MEDIACTRL=ON
      - -DwxUSE_DETECT_SM=OFF
      - -DwxUSE_PRIVATE_FONTS=ON
      - -DwxUSE_OPENGL=ON
      - -DwxUSE_GLCANVAS_EGL=ON
      - -DwxUSE_WEBREQUEST=ON
      - -DwxUSE_WEBVIEW=ON
      - -DwxUSE_WEBVIEW_EDGE=OFF
      - -DwxUSE_WEBVIEW_IE=OFF
      - -DwxUSE_REGEX=builtin
      - -DwxUSE_LIBSDL=OFF
      - -DwxUSE_XTEST=OFF
      - -DwxUSE_STC=OFF
      - -DwxUSE_AUI=ON
      - -DwxUSE_LIBPNG=sys
      - -DwxUSE_ZLIB=sys
      - -DwxUSE_LIBJPEG=sys
      - -DwxUSE_LIBTIFF=OFF
      # sys, not builtin (unlike the static deps build): wxWidgets installs the
      # builtin libwxwebp*.so only for static builds, so a shared build leaves
      # them missing at runtime. The GNOME runtime provides libwebp.
      - -DwxUSE_LIBWEBP=sys
      - -DwxUSE_EXPAT=sys
      - -DwxUSE_NANOSVG=OFF
      - -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld
      - -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld
      - -DCMAKE_MODULE_LINKER_FLAGS=-fuse-ld=lld
    sources:
      # Use git instead of archive: wxWidgets 3.3 relies on multiple git
      # submodules (PCRE2, etc.) that are not included in GitHub tarballs.
      - type: git
        url: https://github.com/OrcaSlicer/Orca-deps-wxWidgets.git
        branch: v3.3.2
        commit: b44c39c100975a0ac0e46f937aa3f3eae5e18631

  - name: orca_deps
    buildsystem: simple
    build-commands:
      # start build
      - |
        set -euo pipefail
        export CMAKE_POLICY_VERSION_MINIMUM=3.5
        export FLATPAK_BUILDER_N_JOBS="${FLATPAK_BUILDER_N_JOBS:-4}"
        mkdir -p deps/build_flatpak && cd deps/build_flatpak
        cmake -G Ninja ../ \
          -DDEP_WX_GTK3=ON \
          -DDEP_DOWNLOAD_DIR=/run/build/orca_deps/external-packages \
          -DCMAKE_PREFIX_PATH=/app \
          -DDESTDIR=/app \
          -DFLATPAK=ON \
          -DCMAKE_INSTALL_PREFIX=/app \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        cmake --build . -j"${FLATPAK_BUILDER_N_JOBS}"
        test -f /app/include/openvdb/version.h
        test -f /app/lib/libopenvdb.a -o -f /app/lib64/libopenvdb.a
        rm -rf /run/build/orca_deps/external-packages

      # uv runs from the app resources at runtime and CMake finds it there
      # instead of downloading it (no network in the build sandbox). It has to
      # be in place before the Snapmaker_Orca module configures, which this module
      # always precedes.
      - install -Dm755 uv/uv /app/share/Snapmaker_Orca/tools/uv/uv

    cleanup:
      # Keep headers and static libs in /app for the Snapmaker_Orca module (SLIC3R_STATIC=ON).
      - "*.la"
      - "/share/pkgconfig"
    
